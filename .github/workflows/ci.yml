name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── security gates ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan tracked files for committed secrets
        run: node apps/storefront/scripts/secret-scan.mjs

  dependency-audit:
    name: Dependency audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Never `pnpm audit || true`: an advisory must fail the build unless it is
      # covered by an active, approved, time-boxed exception.
      # See docs/release/CI_SECURITY.md.
      - name: Audit dependencies
        run: node apps/storefront/scripts/audit-deps.mjs
        env:
          AUDIT_LEVEL: high

  # ── build-quality gates ──────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (workspace)
        run: pnpm lint
      - name: Typecheck (workspace)
        run: pnpm typecheck

  unit-tests:
    name: Unit tests (backend + storefront)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medusa -d medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Backend unit tests
        run: pnpm --filter @snehavrinda-kala/backend test
      - name: Storefront unit tests
        run: pnpm --filter @snehavrinda-kala/storefront test
      - name: Storefront typecheck
        run: pnpm --filter @snehavrinda-kala/storefront typecheck

  migration-validation:
    name: Migration / schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec snehavrinda-postgres pg_isready -U medusa -d medusa >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Verify schema against migrations
        run: pnpm --filter @snehavrinda-kala/storefront db:verify
        env:
          DATABASE_URL: postgresql://medusa:medusa@localhost:5432/medusa?sslmode=disable
      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down -v

  # ── build + smoke ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - secret-scan
      - dependency-audit
      - lint-and-typecheck
      - unit-tests
      - migration-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (workspace)
        run: pnpm build

  e2e-smoke:
    name: E2E smoke (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start services (Compose)
        run: docker compose up -d postgres redis backend
      - name: Seed database
        run: pnpm seed
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          ADMIN_EMAIL: admin@snehavrindakala.example
          ADMIN_PASSWORD: admin-secret-change-me
      - name: Run storefront E2E smoke
        run: pnpm --filter @snehavrinda-kala/storefront test:e2e
