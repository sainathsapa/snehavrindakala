name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          pnpm --filter @snehavrinda-kala/backend run typecheck
          pnpm --filter @snehavrinda-kala/storefront run typecheck

      - name: Run tests
        run: pnpm --filter @snehavrinda-kala/backend run test

  builds:
    needs: lint-type-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @snehavrinda-kala/storefront run build

  deploy:
    needs: builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Build and push Docker image
        run: |
          docker build -f apps/backend/Dockerfile \
            -t ${{ secrets.ECR_REGISTRY }}/snehavrinda-backend:${{ github.sha }} .
          docker push ${{ secrets.ECR_REGISTRY }}/snehavrinda-backend:${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ENVIRONMENT }}-snehavrinda-backend \
            --service ${{ env.ENVIRONMENT }}-snehavrinda-backend-api \
            --force-new-deployment

      - name: Deploy storefront to Vercel
        run: |
          cd apps/storefront
          npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
