# Local development services for SnehaVrinda Kala
# Start with: docker compose up -d
# Requires: .env file populated (copy from .env.example)
services:
  postgres:
    image: postgres:16-alpine
    container_name: snehavrinda-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snehavrinda

  redis:
    image: redis:7-alpine
    container_name: snehavrinda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snehavrinda

  backend:
    container_name: snehavrinda-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    # Production server (medusa start). The image never runs `develop`.
    environment:
      DATABASE_URL: postgresql://medusa:medusa@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_ADMIN_URL: http://localhost:9000/app
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:7000,http://localhost:3000
      AUTH_CORS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env (openssl rand -hex 32)}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SHIPROCKET_API_TOKEN: ${SHIPROCKET_API_TOKEN:-}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
      SANITY_DATASET: ${SANITY_DATASET:-production}
      SANITY_API_TOKEN: ${SANITY_API_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snehavrinda

  storefront:
    container_name: snehavrinda-storefront
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      # Server-side calls use the Docker network hostname.
      MEDUSA_BACKEND_URL: http://backend:9000
      # Browser-facing URL (only used by client components if any).
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      MEDUSA_REGION_ID: ${MEDUSA_REGION_ID:-}
      MEDUSA_CURRENCY_CODE: ${MEDUSA_CURRENCY_CODE:-inr}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-http://localhost:3000}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@snehavrindakala.example}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
      NEXT_PUBLIC_SANITY_DATASET: ${SANITY_DATASET:-production}
      NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-2026-01-01}
      # Admin access control
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - snehavrinda

volumes:
  postgres_data:
  redis_data:

networks:
  snehavrinda:
    driver: bridge
