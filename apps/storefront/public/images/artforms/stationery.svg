<svg width="600" height="140" viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B96545;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8C4A32;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D8A441;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F4C470;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <rect width="600" height="140" fill="#F7F4ED"/>
  
  <!-- Diya lamp body -->
  <g transform="translate(50, 50)">
    <path d="M30,60 Q60,20 90,60 Q60,100 30,60 Z" fill="url(#terracottaGrad)" filter="url(#glow)"/>
    <path d="M30,60 Q60,80 90,60" fill="none" stroke="#5D2E1E" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="60" cy="55" rx="25" ry="18" fill="url(#saffronGrad)" opacity="0.9"/>
    <circle cx="60" cy="50" r="9" fill="#FFFDF0" filter="url(#glow)">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M52,55 L68,55" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 32; 32 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Brand text -->
  <text x="140" y="75" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#242321" letter-spacing="1">SnehaVrinda</text>
  <text x="140" y="110" font-family="'Manrope', sans-serif" font-size="16" fill="#6B6862" letter-spacing="3">A home for art in all its forms</text>
  
  <!-- Decorative dots -->
  <circle cx="520" cy="45" r="4" fill="#B96545" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="85" r="4" fill="#D8A441" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="105" r="4" fill="#343C67" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
