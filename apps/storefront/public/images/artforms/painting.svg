<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lotusRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFDE7;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFE0B2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="700" height="700" fill="#FAF5EA"/>

  <!-- Background mandala circles -->
  <circle cx="350" cy="350" r="320" fill="#FFF3E0" opacity="0.4"/>
  <circle cx="350" cy="350" r="300" fill="none" stroke="#FFB74D" stroke-width="2" stroke-dasharray="14,7" opacity="0.4"/>
  <circle cx="350" cy="350" r="280" fill="none" stroke="#E68A2E" stroke-width="1" stroke-dasharray="7,5" opacity="0.3"/>

  <!-- Rotating Lotus Mandala -->
  <g transform="translate(350, 350)">
    <!-- Outer layer - 12 rounded lotus petals in full circle -->
    <g id="outerPetals">
      <path d="M0,-120 Q60,-60 120,0 Q60,60 0,120 Q-60,60 -120,0 Q-60,-60 0,-120 Z" fill="url(#lotusRadial)" filter="url(#softGlow)" opacity="0.9"/>
      <path d="M-120,0 Q-60,-60 0,-120 Q60,-60 120,0 Q60,60 0,120 Q-60,60 -120,0 Z" fill="url(#lotusRadial)" filter="url(#softGlow)" opacity="0.9"/>
    </g>
    <!-- Inner layer -->
    <g id="innerPetals">
      <path d="M0,-70 Q35,-35 70,0 Q35,35 0,70 Q-35,35 -70,0 Q-35,-35 0,-70 Z" fill="#FFF8E1" filter="url(#softGlow)" opacity="0.95"/>
      <path d="M-70,0 Q-35,-35 0,-70 Q35,-35 70,0 Q35,35 0,70 Q-35,35 -70,0 Z" fill="#FFF8E1" filter="url(#softGlow)" opacity="0.95"/>
    </g>
    <!-- Center bindi -->
    <circle r="18" fill="#FF5722" filter="url(#softGlow)">
      <animate attributeName="r" values="16;22;16" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#FFF9C4">
      <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#FFFFFF">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Sanskrit Om symbol -->
    <text x="0" y="400" font-family="serif" font-size="60" fill="#E68A2E" text-anchor="middle" opacity="0.25" style="font-style: italic;">ॐ</text>
  </g>

  <!-- Four corner lotus buds -->
  <g transform="translate(100, 100)">
    <path d="M0,0 Q-35,-40 -70,0 Q-35,40 0,0 Q35,40 70,0 Q35,-40 0,0 Z" fill="#FFE0B2" opacity="0.8"/>
    <path d="M-35,-20 Q0,-30 35,-20 Q0,0 -35,-20 Z" fill="#FFF3E0" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#FF5722"/>
  </g>
  <g transform="translate(600, 100) scale(-1, 1)">
    <path d="M0,0 Q-35,-40 -70,0 Q-35,40 0,0 Q35,40 70,0 Q35,-40 0,0 Z" fill="#FFE0B2" opacity="0.8"/>
    <path d="M-35,-20 Q0,-30 35,-20 Q0,0 -35,-20 Z" fill="#FFF3E0" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#FF5722"/>
  </g>
  <g transform="translate(100, 600) scale(1, -1)">
    <path d="M0,0 Q-35,-40 -70,0 Q-35,40 0,0 Q35,40 70,0 Q35,-40 0,0 Z" fill="#FFE0B2" opacity="0.8"/>
    <path d="M-35,-20 Q0,-30 35,-20 Q0,0 -35,-20 Z" fill="#FFF3E0" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#FF5722"/>
  </g>
  <g transform="translate(600, 600) scale(-1, -1)">
    <path d="M0,0 Q-35,-40 -70,0 Q-35,40 0,0 Q35,40 70,0 Q35,-40 0,0 Z" fill="#FFE0B2" opacity="0.8"/>
    <path d="M-35,-20 Q0,-30 35,-20 Q0,0 -35,-20 Z" fill="#FFF3E0" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#FF5722"/>
  </g>
</svg>
