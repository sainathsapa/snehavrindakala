# ─────────────────────────────────────────────────────────────────────────────
# nginx — front door for SnehaVrinda Kala
#
#   :80   → ACME challenge paths served from disk; everything else 301 to https
#   :443  → www.<domain>  → storefront:3000
#           api.<domain>  → backend:9000
#
# The application containers bind to 127.0.0.1 only (see docker-compose.yml), so
# this file is the single public surface: nothing else is reachable from the
# internet, and ports 3000/9000 never appear in a browser address bar.
#
# Domains arrive from the environment (STOREFRONT_DOMAIN / API_DOMAIN) through
# the official image's envsubst step. nginx's own variables ($host, $uri) are
# not in the environment and are therefore left untouched.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

# Keeps CPU modest on a 2 GB Lightsail box.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real client IP: needed because the proxy runs the rate limiter and the
    # audit log, and both must see the visitor, not the container.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    types_hash_max_size 2048;

    keepalive_timeout  65;
    client_body_timeout 20s;
    client_header_timeout 20s;

    # Artwork uploads from the admin panel are the largest thing that passes
    # through here; a big painting photograph is a few MB, never 25.
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/rss+xml image/svg+xml application/manifest+json;

    # WebSocket upgrade (Next.js HMR in preview deployments, any SSE stream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Trust the loopback proxy hop only.
    set_real_ip_from 127.0.0.1;

    include /etc/nginx/conf.d/*.conf;
}
