<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B96545;stop-opacity:0.7"/>
      <stop offset="25%" style="stop-color:#D8A441;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#343C67;stop-opacity:0.6"/>
      <stop offset="75%" style="stop-color:#D8A441;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#B96545;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="120" fill="#F7F4ED"/>
  
  <!-- Main wave border -->
  <path d="M0,60 Q150,20 300,60 T600,60 T900,60 T1200,60" 
        fill="none" stroke="url(#borderGradient)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Secondary inner wave -->
  <path d="M0,60 Q150,100 300,60 T600,60 T900,60 T1200,60" 
        fill="none" stroke="#B96545" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Decorative floral motifs -->
  <g transform="translate(100, 30)">
    <circle cx="0" cy="0" r="6" fill="#B96545"/>
    <path d="M-8,-4 Q0,-12 8,-4 Q8,8 -8,8 Z" fill="#D8A441"/>
    <circle cx="0" cy="0" r="2" fill="#FFFDF0"/>
  </g>
  <g transform="translate(400, 30)">
    <circle cx="0" cy="0" r="6" fill="#B96545"/>
    <path d="M-8,-4 Q0,-12 8,-4 Q8,8 -8,8 Z" fill="#D8A441"/>
    <circle cx="0" cy="0" r="2" fill="#FFFDF0"/>
  </g>
  <g transform="translate(700, 30)">
    <circle cx="0" cy="0" r="6" fill="#B96545"/>
    <path d="M-8,-4 Q0,-12 8,-4 Q8,8 -8,8 Z" fill="#D8A441"/>
    <circle cx="0" cy="0" r="2" fill="#FFFDF0"/>
  </g>
  <g transform="translate(1000, 30)">
    <circle cx="0" cy="0" r="6" fill="#B96545"/>
    <path d="M-8,-4 Q0,-12 8,-4 Q8,8 -8,8 Z" fill="#D8A441"/>
    <circle cx="0" cy="0" r="2" fill="#FFFDF0"/>
  </g>
  
  <!-- Bottom wave -->
  <path d="M0,60 Q150,90 300,60 T600,60 T900,60 T1200,60" 
        fill="none" stroke="url(#borderGradient)" stroke-width="5" stroke-linecap="round"/>
</svg>
