<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lotusBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFECB3"/>
    </linearGradient>
    <radialGradient id="petalGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE0B2"/>
      <stop offset="50%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#FF8A65"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF9933"/>
      <stop offset="50%" style="stop-color:#FF6F00"/>
      <stop offset="100%" style="stop-color:#FF5722"/>
    </radialGradient>
    <radialGradient id="petalGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE0B2"/>
      <stop offset="50%" style="stop-color:#FFD6A4"/>
      <stop offset="100%" style="stop-color:#FFCC80"/>
    </radialGradient>
    <filter id="lotusGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#lotusBgGrad)"/>

  <!-- Central water surface -->
  <ellipse cx="400" cy="280" rx="180" ry="20" fill="#FFE0B2" opacity="0.6"/>
  <ellipse cx="400" cy="280" rx="140" ry="15" fill="#FFD6A3" opacity="0.7"/>

  <!-- Lotus outer petals (12 petals) -->
  <g transform="translate(400, 280)">
    <path d="M0,-90 Q45,-60 90,0 Q45,60 0,90 Q-45,60 -90,0 Q-45,-60 0,-90 Z" fill="url(#petalGrad1)" filter="url(#lotusGlow)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="8 0 0" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="8 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-90 Q45,-60 90,0 Q45,60 0,90 Q-45,60 -90,0 Q-45,-60 0,-90 Z" fill="url(#petalGrad2)" filter="url(#lotusGlow)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-6 0 0" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="-6 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-90 Q45,-60 90,0 Q45,60 0,90 Q-45,60 -90,0 Q-45,-60 0,-90 Z" fill="url(#petalGrad3)" filter="url(#lotusGlow)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="8 0 0" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="8 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-90 Q45,-60 90,0 Q45,60 0,90 Q-45,60 -90,0 Q-45,-60 0,-90 Z" fill="#FFE0B2" filter="url(#lotusGlow)" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-6 0 0" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="-6 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- Lotus center -->
    <circle cx="0" cy="0" r="14" fill="#FF5722" filter="url(#lotusGlow)">
      <animate attributeName="r" values="12;18;12" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#FF5722;#D32F2F;#FF5722" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#FFEB3B">
      <animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF">
      <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Central decorative swirl -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative lotus buds -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="25" fill="#FFE0B2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,0 Q-15,-20 -30,0 Q-15,20 0,0 Q15,20 30,0 Q15,-20 0,0 Z" fill="#FFE0B2" opacity="0.7"/>
    <path d="M-15,-5 Q0,-10 15,-5 Q0,0 -15,-5 Z" fill="#FFECB3" opacity="0.9"/>
  </g>

  <g transform="translate(620, 200) scale(0.8)">
    <circle cx="0" cy="0" r="22" fill="#FFE0B2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,0 Q-12,-16 -24,0 Q-12,16 0,0 Q12,16 24,0 Q12,-16 0,0 Z" fill="#FFB74D" opacity="0.7"/>
    <path d="M-12,-4 Q0,-6 12,-4 Q0,0 -12,-4 Z" fill="#FFF8E1" opacity="0.9"/>
  </g>

  <!-- Floating lotuses -->
  <g transform="translate(350, 100)" opacity="0.6">
    <circle cx="0" cy="0" r="18" fill="#FFECB3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-11 Q9,-5 11,0 Q9,5 0,11 Q-9,5 -11,0 Q-9,-5 0,-11 Z" fill="#FFB74D" opacity="0.8"/>
  </g>

  <g transform="translate(500, 170) scale(-1,1)">
    <circle cx="0" cy="0" r="15" fill="#FFECB3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,0 Q-11,-5 -11,0 Q0,0 11,0 Q11,-5 0,0 Z" fill="#FFB74D" opacity="0.8"/>
  </g>

  <!-- Title text -->
  <text x="400" y="470" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#B7410E" text-anchor="middle" letter-spacing="2">Blooming Lotus</text>
</svg>
