<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="peacockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B1B3A"/>
      <stop offset="50%" style="stop-color:#2D2D6B"/>
      <stop offset="100%" style="stop-color:#141432"/>
    </linearGradient>
    <linearGradient id="peacockFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="20%" style="#FFD54F"/>
      <stop offset="40%" style="#FFCA28"/>
      <stop offset="60%" style="#FF9800"/>
      <stop offset="80%" style="#F57C00"/>
      <stop offset="100%" style="#E65100"/>
    </linearGradient>
    <linearGradient id="neckFeatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A148C"/>
      <stop offset="50%" style="#7B1FA2"/>
      <stop offset="100%" style="#4A148C"/>
    </linearGradient>
    <linearGradient id="tealFeatherGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00838F"/>
      <stop offset="50%" style="#00ACC1"/>
      <stop offset="100%" style="#006064"/>
    </linearGradient>
    <linearGradient id="goldFeatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB3B"/>
      <stop offset="50%" style="#FFC107"/>
      <stop offset="100%" style="#FF8F00"/>
    </linearGradient>
    <filter id="peacockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="#FAF5EA"/>

  <!-- Peacock body / tail background -->
  <ellipse cx="450" cy="420" rx="380" ry="120" fill="#F5E6D3"/>

  <!-- Peacock feather fan (left) -->
  <g transform="translate(120, 220)">
    <!-- Main feather shaft -->
    <path d="M0,0 Q0,-180 0,-360" fill="none" stroke="#8B4513" stroke-width="10" stroke-linecap="round"/>
    <!-- Peacock blue feather layers -->
    <path d="M0,-20 Q30,-90 0,-180 Q-30,-90 0,-20 Z" fill="#4A148C" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="8 0 0" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="8 0 0" to="0 0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-40 Q35,-100 0,-200 Q-35,-100 0,-40 Z" fill="url(#tealFeatherGrad)" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-8 0 0" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="-8 0 0" to="0 0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- Eye spots -->
    <circle cx="0" cy="-120" r="18" fill="#FFD54F" filter="url(#peacockGlow)">
      <animate attributeName="r" values="14;22;14" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#FFD54F;#FF9800;#FFD54F" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-120" r="8" fill="#B71C1C"/>
    <circle cx="0" cy="-120" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Peacock feather 1 (left) - ornate -->
  <g transform="translate(180, 100) rotate(-25)">
    <path d="M0,0 Q0,-150 0,-300" fill="none" stroke="#6D4C41" stroke-width="8" stroke-linecap="round"/>
    <path d="M0,-40 Q40,-80 0,-160 Q-40,-80 0,-40 Z" fill="url(#peacockFeatherGrad)" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="6 0 0" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="6 0 0" to="0 0 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-60 Q45,-100 0,-200 Q-45,-100 0,-60 Z" fill="url(#goldFeatherGrad)" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-6 0 0" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="-6 0 0" to="0 0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="-130" r="16" fill="#FFEB3B" filter="url(#peacockGlow)">
      <animate attributeName="r" values="12;20;12" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-130" r="6" fill="#D32F2F"/>
  </g>

  <!-- Peacock feather 2 (right) - teal -->
  <g transform="translate(700, 100) rotate(25)">
    <path d="M0,0 Q0,-150 0,-300" fill="none" stroke="#6D4C41" stroke-width="8" stroke-linecap="round"/>
    <path d="M0,-40 Q40,-80 0,-160 Q-40,-80 0,-40 Z" fill="url(#tealFeatherGrad)" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="6 0 0" dur="5.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="6 0 0" to="0 0 0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-60 Q45,-100 0,-200 Q-45,-100 0,-60 Z" fill="url(#neckFeatherGrad)" filter="url(#peacockGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-6 0 0" dur="6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="-6 0 0" to="0 0 0" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="-130" r="16" fill="#00ACC1" filter="url(#peacockGlow)">
      <animate attributeName="r" values="12;20;12" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-130" r="6" fill="#B2DFDB"/>
  </g>

  <!-- Peacock feathers radiating background -->
  <g stroke-linecap="round">
    <path d="M450,80 Q430,60 420,40" stroke="#FFB74D" stroke-width="6" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M450,80 Q470,60 480,40" stroke="#FF9933" stroke-width="6" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M450,80 Q450,50 450,20" stroke="#E65100" stroke-width="6" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M450,80 Q430,100 420,120" stroke="#F57C00" stroke-width="6" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M450,80 Q470,100 480,120" stroke="#FFB74D" stroke-width="6" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Colorful peacock ornaments -->
  <g transform="translate(450, 380)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FF9933" stroke-width="2" stroke-dasharray="8,6" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;60;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#4B0082" stroke-width="2" stroke-dasharray="6,4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;48;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FF5722" stroke-width="1" stroke-dasharray="12,8" opacity="0.3">
      <animate attributeName="stroke-dashoffset" values="0;72;0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated lotus flowers floating -->
  <g transform="translate(250, 140)">
    <circle cx="0" cy="0" r="35" fill="#FFF3E0" opacity="0.9">
      <animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-25 Q15,-12 25,0 Q15,12 0,25 Q-15,12 -25,0 Q-15,-12 0,-25 Z" fill="#FFB74D" opacity="0.85"/>
    <path d="M-12,-8 Q0,-14 12,-8 Q0,0 -12,-8 Z" fill="#FFF8E1" opacity="0.9"/>
  </g>
  <g transform="translate(650, 140) scale(0.9)">
    <circle cx="0" cy="0" r="32" fill="#FFF3E0" opacity="0.9">
      <animate attributeName="r" values="28;36;28" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-22 Q12,-11 20,0 Q12,11 0,22 Q-12,11 -20,0 Q-12,-11 0,-22 Z" fill="#FF8A65" opacity="0.85"/>
    <path d="M-10,-7 Q0,-11 10,-7 Q0,0 -10,-7 Z" fill="#FFF3E0" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="450" y="480" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="700" fill="#B7410E" text-anchor="middle" letter-spacing="2">The Peacock's Dance</text>
</svg>
