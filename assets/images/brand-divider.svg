<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B7410E;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#FF9933;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <rect width="900" height="100" fill="#FAF5EA"/>

  <!-- Main divider line -->
  <path d="M0,50 Q200,20 450,50 T900,50" fill="none" stroke="url(#divGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative diya motifs -->
  <g transform="translate(150, 30)">
    <path d="M0,15 Q10,5 20,15 Q10,25 0,15 Z" fill="#D2691E"/>
    <path d="M0,15 Q-4,10 0,5 Q4,10 0,15 Z" fill="#FFF176" opacity="0.9">
      <animate attributeName="d" values="M0,15 Q-4,10 0,5 Q4,10 0,15 Z; M0,15 Q-3,9 0,-1 Q3,9 0,15 Z; M0,15 Q-4,10 0,5 Q4,10 0,15 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="10" cy="10" r="2" fill="#FFD700"/>
  </g>
  <g transform="translate(450, 30)">
    <path d="M0,15 Q10,5 20,15 Q10,25 0,15 Z" fill="#D2691E"/>
    <path d="M0,15 Q-4,10 0,5 Q4,10 0,15 Z" fill="#FFF176" opacity="0.9">
      <animate attributeName="d" values="M0,15 Q-4,10 0,5 Q4,10 0,15 Z; M0,15 Q-3,9 0,-1 Q3,9 0,15 Z; M0,15 Q-4,10 0,5 Q4,10 0,15 Z" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="10" cy="10" r="2" fill="#FFD700"/>
  </g>
  <g transform="translate(750, 30)">
    <path d="M0,15 Q10,5 20,15 Q10,25 0,15 Z" fill="#D2691E"/>
    <path d="M0,15 Q-4,10 0,5 Q4,10 0,15 Z" fill="#FFF176" opacity="0.9">
      <animate attributeName="d" values="M0,15 Q-4,10 0,5 Q4,10 0,15 Z; M0,15 Q-3,9 0,-1 Q3,9 0,15 Z; M0,15 Q-4,10 0,5 Q4,10 0,15 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="10" cy="10" r="2" fill="#FFD700"/>
  </g>

  <!-- Lotus corner accents -->
  <path d="M50,80 Q40,60 30,80 Q40,100 50,80 Z" fill="#FFE0B2" opacity="0.7"/>
  <circle cx="50" cy="80" r="2" fill="#FF5722"/>
  <path d="M850,80 Q860,60 870,80 Q860,100 850,80 Z" fill="#FFE0B2" opacity="0.7"/>
  <circle cx="850" cy="80" r="2" fill="#FF5722"/>
</svg>
