<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B7410E;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FF9933;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="divFlameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="120" fill="#FAF5EA"/>

  <!-- Main curved divider -->
  <path d="M0,60 Q225,20 450,60 T900,60" fill="none" stroke="url(#divGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Decorative diya flames -->
  <g transform="translate(150, 50)">
    <path d="M0,20 Q12,10 24,20 Q12,30 0,20 Z" fill="#CD853F"/>
    <path d="M0,20 Q-6,14 0,5 Q6,14 0,20 Z" fill="#FFF176" opacity="0.95" filter="url(#divFlameGlow)">
      <animate attributeName="d" values="M0,20 Q-6,14 0,5 Q6,14 0,20 Z; M0,20 Q-4,12 0,2 Q4,12 0,20 Z; M0,20 Q-6,14 0,5 Q6,14 0,20 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="12" cy="14" r="3" fill="#FFD700"/>
  </g>
  <g transform="translate(450, 50)">
    <path d="M0,20 Q12,10 24,20 Q12,30 0,20 Z" fill="#CD853F"/>
    <path d="M0,20 Q-6,14 0,5 Q6,14 0,20 Z" fill="#FFF176" opacity="0.95" filter="url(#divFlameGlow)">
      <animate attributeName="d" values="M0,20 Q-6,14 0,5 Q6,14 0,20 Z; M0,20 Q-4,12 0,2 Q4,12 0,20 Z; M0,20 Q-6,14 0,5 Q6,14 0,20 Z" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="12" cy="14" r="3" fill="#FFD700"/>
  </g>
  <g transform="translate(750, 50)">
    <path d="M0,20 Q12,10 24,20 Q12,30 0,20 Z" fill="#CD853F"/>
    <path d="M0,20 Q-6,14 0,5 Q6,14 0,20 Z" fill="#FFF176" opacity="0.95" filter="url(#divFlameGlow)">
      <animate attributeName="d" values="M0,20 Q-6,14 0,5 Q6,14 0,20 Z; M0,20 Q-4,12 0,2 Q4,12 0,20 Z; M0,20 Q-6,14 0,5 Q6,14 0,20 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="12" cy="14" r="3" fill="#FFD700"/>
  </g>

  <!-- Lotus corner accents -->
  <path d="M50,90 Q40,70 30,90 Q40,110 50,90 Z" fill="#FFE0B2" opacity="0.75"/>
  <circle cx="50" cy="90" r="3" fill="#FF5722"/>
  <path d="M850,90 Q860,70 870,90 Q860,110 850,90 Z" fill="#FFE0B2" opacity="0.75"/>
  <circle cx="850" cy="90" r="3" fill="#FF5722"/>
</svg>
